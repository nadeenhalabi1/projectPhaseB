<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/">
  <title>Redirecting...</title>
  <script>
    // Capture the current URL path and redirect to index.html with path preserved
    const path = window.location.pathname;
    if (path !== '/') {
      sessionStorage.setItem('redirectPath', path);
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
